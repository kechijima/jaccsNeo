<!-- Vue起動前（JS読み込み中）に表示する静的なプレースホルダー。
     未ログインの場合はログイン画面そっくりの見た目（静的な複製）を描画し、
     待たされている印象・不安感を減らす。Vue起動後、実際のログイン画面
     （app/pages/login.vue）に瞬時に置き換わるため、利用者には「開いたら
     最初からログイン画面だった」ように見える。
     一方、ログイン済みセッションがある場合にまでこの偽ログイン画面を出すと、
     F5直後にこれを見たユーザーが「ログアウトさせられた」と誤解してしまう
     （実際にはこの直後に元の画面へ瞬時に置き換わるだけ）。そのため、前回
     ログイン済みだったことを示す目印（jaccsneo:wasLoggedIn、useAuth.tsが
     ログイン成功時に設定・ログアウト時に削除）がlocalStorageにある場合は、
     下部のスクリプトでこちらではなく単純な「読み込み中」表示
     （#jaccsneo-boot-plain-loading）に差し替える。
     ここで使っているクラス（input-field/btn-primary/card等）はlogin.vue・
     layouts/auth.vueで実際に使われているものと同じで、Tailwindの content scan
     （tailwind.config.tsのcontent、*.vueのみ対象）はそちらを経由して拾われるため、
     このファイル自体がscan対象でなくてもスタイルは問題なく含まれる -->
<div id="jaccsneo-boot-splash" class="min-h-screen bg-gradient-to-br from-primary-50 via-white to-primary-100 flex items-center justify-center p-4">
  <div id="jaccsneo-boot-fake-login" class="w-full max-w-md">
    <div class="text-center mb-8">
      <img src="/logo.png" alt="" class="w-16 h-16 object-contain mx-auto mb-4" />
      <h1 class="text-2xl font-bold text-gray-900">JACCS Neo</h1>
      <p class="mt-1 text-sm text-gray-500">FP業務管理システム</p>
      <div class="mt-2 flex items-center justify-center gap-1.5 text-xs text-gray-400">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-3.5 w-3.5 animate-spin">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
        </svg>
        読み込み中...
      </div>
    </div>

    <div class="card p-8">
      <h2 class="text-lg font-semibold text-gray-900 mb-6">ログイン</h2>

      <!-- Vue起動前は送信しても何も起きないよう、ネイティブのフォーム送信は止めておく -->
      <form onsubmit="return false" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">メールアドレス</label>
          <input type="email" autocomplete="email" placeholder="example@email.com" class="input-field" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">パスワード</label>
          <input type="password" autocomplete="current-password" placeholder="••••••••" class="input-field" />
        </div>
        <button type="submit" class="btn-primary w-full">ログイン</button>
      </form>

      <div class="mt-4 text-center">
        <button type="button" class="text-sm text-primary-600 hover:text-primary-700 hover:underline">パスワードをお忘れの方</button>
      </div>
    </div>

    <p class="mt-6 text-center text-xs text-gray-400">© JACCS Neo. All rights reserved.</p>

    <!-- 回線状況によっては起動に時間がかかることがあるため、待たせるだけにならないよう
         簡単な使い方のヒントを表示する（この画面自体はVue起動前の静的な画面のため、
         ここでは実際のマニュアル画面へのリンク・アコーディオン等の対話的な機能は使えず、
         プレーンなテキストのみで案内する） -->
    <div id="jaccsneo-boot-tip" style="display:none;" class="mt-4 text-center text-xs text-gray-400"></div>
  </div>

  <!-- 前回ログイン済みだった場合に表示する、ログイン画面とは似ていない単純な
       読み込み中表示（下部のスクリプトでjaccsneo-boot-fake-loginと差し替える） -->
  <div id="jaccsneo-boot-plain-loading" style="display:none;" class="flex flex-col items-center gap-3">
    <img src="/logo.png" alt="" class="w-16 h-16 object-contain" />
    <div class="flex items-center gap-2 text-sm text-gray-500">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4 animate-spin">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
      </svg>
      読み込み中...
    </div>
  </div>
</div>
<script>
(function () {
  try {
    if (localStorage.getItem('jaccsneo:wasLoggedIn') === '1') {
      document.getElementById('jaccsneo-boot-fake-login').style.display = 'none';
      document.getElementById('jaccsneo-boot-plain-loading').style.display = 'flex';
    }
  } catch (e) {}
})();
</script>
<script>
(function () {
  try {
    var TIPS = [
      'ヒント: サイドバー・スマホメニューの「マニュアル」から各画面の使い方をいつでも確認できます',
      'ヒント: 「検索」から組合員・パーソナルデータ・掲示板の投稿を横断的に探せます',
      'ヒント: アプリ・掲示板の★アイコンでお気に入り登録すると、ダッシュボードにまとめて表示されます',
      'ヒント: 申請は「新規申請」から。承認待ちの間は内容を編集できます',
    ];
    var el = document.getElementById('jaccsneo-boot-tip');
    if (!el) return;
    var i = 0;
    var intervalId = null;
    var show = function () {
      if (!document.getElementById('jaccsneo-boot-splash')) {
        if (intervalId) clearInterval(intervalId);
        return;
      }
      el.textContent = TIPS[i % TIPS.length];
      el.style.display = 'block';
      i++;
    };
    setTimeout(function () {
      show();
      intervalId = setInterval(show, 5000);
    }, 3000);
  } catch (e) {}
})();
</script>
<script>
// 待機時間を短くして試したところ、かえって遅くなるという報告があった。
// これは「途中で止まっている」のではなく「初回接続の確立自体に時間が
// かかっている（DNS/TLSのコールドスタート）」だけの可能性が高く、
// その場合は早期にreloadしてしまうと進行中の読み込みを中断し、
// 最初からやり直しになる分むしろ遅くなる。そのため待機時間は長めに戻し、
// 本当に止まっている場合の最終手段としてのみ働くようにしてある
// （回線そのものの高速化は preconnect 等、別の対策で行う）
(function () {
  try {
    var RETRY_KEY = 'jaccsneo:boot-retry-count';
    var MAX_RETRIES = 1;
    var count = Number(sessionStorage.getItem(RETRY_KEY) || '0');
    if (count >= MAX_RETRIES) return;
    setTimeout(function () {
      if (!document.getElementById('jaccsneo-boot-splash')) return;
      sessionStorage.setItem(RETRY_KEY, String(count + 1));
      var reloaded = false;
      var reload = function () {
        if (reloaded) return;
        reloaded = true;
        location.reload();
      };
      // 念のため、古いService Worker・キャッシュが残っていれば削除してから
      // 再読み込みする（通常のデプロイ検知のたびには行わない。あくまで最終手段）
      if ('serviceWorker' in navigator && 'caches' in window) {
        setTimeout(reload, 3000); // 削除処理自体が固まった場合の保険
        Promise.all([
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }),
          caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }),
        ]).then(reload, reload);
      } else {
        reload();
      }
    }, 20000);
  } catch (e) {}
})();
</script>
