<div id="jaccsneo-boot-splash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#ffffff;z-index:9999;">
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
    <img src="/logo.png" alt="" style="width:64px;height:64px;object-fit:contain;" />
    <div style="display:flex;align-items:center;gap:8px;font-size:14px;color:#6b7280;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;">
      <span style="width:16px;height:16px;border:2px solid #00afcc;border-top-color:transparent;border-radius:50%;display:inline-block;animation:jaccsneo-spin 0.8s linear infinite;"></span>
      読み込み中...
    </div>
  </div>
</div>
<style>
@keyframes jaccsneo-spin { to { transform: rotate(360deg); } }
</style>
<script>
// 待機時間を短くして試したところ、かえって遅くなるという報告があった。
// これは「途中で止まっている」のではなく「初回接続の確立自体に時間が
// かかっている（DNS/TLSのコールドスタート）」だけの可能性が高く、
// その場合は早期にreloadしてしまうと進行中の読み込みを中断し、
// 最初からやり直しになる分むしろ遅くなる。そのため待機時間は長めに戻し、
// 本当に止まっている場合の最終手段としてのみ働くようにしてある
// （回線そのものの高速化は preconnect 等、別の対策で行う）
(function () {
  try {
    var RETRY_KEY = 'jaccsneo:boot-retry-count';
    var MAX_RETRIES = 1;
    var count = Number(sessionStorage.getItem(RETRY_KEY) || '0');
    if (count >= MAX_RETRIES) return;
    setTimeout(function () {
      if (!document.getElementById('jaccsneo-boot-splash')) return;
      sessionStorage.setItem(RETRY_KEY, String(count + 1));
      var reloaded = false;
      var reload = function () {
        if (reloaded) return;
        reloaded = true;
        location.reload();
      };
      // 念のため、古いService Worker・キャッシュが残っていれば削除してから
      // 再読み込みする（通常のデプロイ検知のたびには行わない。あくまで最終手段）
      if ('serviceWorker' in navigator && 'caches' in window) {
        setTimeout(reload, 3000); // 削除処理自体が固まった場合の保険
        Promise.all([
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }),
          caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }),
        ]).then(reload, reload);
      } else {
        reload();
      }
    }, 20000);
  } catch (e) {}
})();
</script>
